<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kickz - Sneaker Store</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <!-- Luces / Esferas de fondo decorativas -->
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    <div class="bg-blur bg-blur-3"></div>

    <main class="app-container">
        <!-- Header con Insignia y Logo de la Imagen -->
        <header class="text-center header-section">
            <div class="badge-tag mx-auto mb-3">
                <i class="bi bi-fire text-danger me-1"></i> SNEAKER STORE 2026
            </div>

            <!-- Contenedor del Logo -->
            <div class="logo-wrapper mx-auto">
                <!-- Reemplaza "logo.png" por el nombre de tu archivo de imagen -->
                <img src="static/img/Logotipo KICKZ con zapatilla urbana.png" alt="KICKZ Sneaker Store Logo" class="logo-img">
            </div>

            <p class="subtitle mt-3">Explora todos tus intereses</p>
        </header>

        <!-- Content Wrapper adaptable en PC y Celular -->
        <div class="content-wrapper">
            <!-- Menú principal -->
            <nav class="nav-section">
                <div class="section-title">
                    <i class="bi bi-compass"></i> Navegación
                </div>

                <a href="#" class="btn btn-menu btn-home d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3">
                            <i class="bi bi-house-door-fill"></i>
                        </div>
                        <span>Home</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted fs-6"></i>
                </a>

                <a href="./pages/about.html" class="btn btn-menu btn-custom d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <span>About</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted fs-6"></i>
                </a>

                <a href="./pages/contact.html" class="btn btn-menu btn-custom d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center">
                        <div class="icon-box me-3">
                            <i class="bi bi-bag"></i>
                        </div>
                        <span>Contact</span>
                    </div>
                    <i class="bi bi-chevron-right text-muted fs-6"></i>
                </a>
            </nav>

            <!-- Sección de Cuentas / Auth -->
            <section class="auth-section">
                <div class="section-title">
                    <i class="bi bi-person"></i> Tu Cuenta
                </div>

                <a href="./pages/login.html" class="btn btn-auth d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-box-arrow-in-right me-3 fs-5"></i>
                        <span>Log in</span>
                    </div>
                    <i class="bi bi-arrow-right-short fs-4"></i>
                </a>

                <a href="#" class="btn btn-auth btn-auth-primary d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-person-plus me-3 fs-5"></i>
                        <span>Sign up</span>
                    </div>
                    <i class="bi bi-arrow-right-short fs-4"></i>
                </a>
            </section>
        </div>

        <!-- Footer decorativo -->
        <footer class="text-center text-muted footer-text">
            &copy; 2026 KICKZ Inc. Todos los derechos reservados.
        </footer>
    </main>

</body>

</html>
