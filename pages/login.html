<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Kickz</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Enlace CSS relativo a la carpeta static -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Luces / Esferas de fondo decorativas -->
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    <div class="bg-blur bg-blur-3"></div>

    <main class="app-container login-page-container">
        <!-- Header con botón de retorno -->
        <header class="login-header d-flex align-items-center justify-content-between w-100">
            <a href="../index.html" class="btn-back text-dark text-decoration-none fs-4">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="badge-tag"><i class="bi bi-shield-lock-fill text-danger me-1"></i> ACCESO SEGURO</span>
            <div style="width: 24px;"></div>
        </header>

        <!-- Contenedor Flex Wrap adaptable de Pantalla Completa para PC -->
        <div class="login-content-wrapper">
            <section class="login-card mx-auto">

                <!-- Recuadro de Foto de Perfil con estilo circular y borde degradado -->
                <div class="avatar-frame-box mx-auto mb-3">
                    <img src="../static/img/perfil.jpg" alt="Foto de perfil" class="avatar-img"
                        onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=111827&color=fff';">
                </div>

                <h1 class="login-title text-center mb-1">¡Bienvenido de nuevo!</h1>
                <p class="login-subtitle text-center text-secondary mb-4">Ingresa tus datos para acceder a tu cuenta</p>

                <!-- Formulario de Login -->
                <form action="#" method="POST" class="w-100">
                    <div class="mb-3">
                        <label for="login-identifier" class="form-label fw-bold">Correo o nombre de usuario *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><i
                                    class="bi bi-envelope text-muted"></i></span>
                            <input type="text" class="form-control custom-input border-start-0 rounded-end-3"
                                id="login-identifier" placeholder="nombre@ejemplo.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="login-password" class="form-label fw-bold">Contraseña *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-3"><i
                                    class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control custom-input border-start-0 rounded-end-3"
                                id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Opciones extras: Recordarme / Olvidé contraseña -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary small" for="rememberMe">
                                Recordarme
                            </label>
                        </div>
                        <a href="#" class="small text-danger text-decoration-none fw-semibold">¿Olvidaste tu
                            contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-login-submit w-100 mb-4">
                        <span>Iniciar sesión</span> <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </form>

                <!-- Enlace a Registro -->
                <div class="text-center signup-redirect">
                    <span class="text-secondary">¿Aún no tienes una cuenta?</span>
                    <a href="#" class="fw-bold text-dark text-decoration-none ms-1">Regístrate gratis</a>
                </div>
            </section>
        </div>

        <!-- Footer decorativo -->
        <footer class="text-center text-muted footer-text w-100 mt-auto pt-3">
            &copy; 2026 KICKZ Inc. Todos los derechos reservados.
        </footer>
    </main>

</body>

</html>
