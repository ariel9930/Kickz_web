<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Kickz</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Enlace CSS relativo a la carpeta static -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <!-- Luces / Esferas de fondo decorativas -->
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    <div class="bg-blur bg-blur-3"></div>

    <main class="app-container contact-page-container">
        <!-- Header de Contacto -->
        <header class="contact-header d-flex align-items-center justify-content-between w-100">
            <a href="../index.html" class="btn-back text-dark text-decoration-none fs-4">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="page-title m-0">Contacto</h1>
            <div style="width: 24px;"></div>
        </header>

        <!-- Contenedor Flex Wrap adaptable -->
        <div class="contact-content-wrapper">

            <!-- Bloque Formulario -->
            <section class="contact-card form-card">
                <form action="#" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Nombre *</label>
                        <input type="text" class="form-control custom-input" id="name" placeholder="Tu nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Correo electrónico *</label>
                        <input type="email" class="form-control custom-input" id="email"
                            placeholder="nombre@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="subject" class="form-label fw-bold">Asunto *</label>
                        <select class="form-select custom-input" id="subject" required>
                            <option value="" selected disabled>Selecciona un asunto</option>
                            <option value="consulta">Consulta general</option>
                            <option value="pedidos">Estado de pedido</option>
                            <option value="soporte">Soporte técnico</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label fw-bold">Mensaje *</label>
                        <textarea class="form-control custom-input" id="message" rows="4"
                            placeholder="Escribe tu mensaje..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-send-message w-100 mb-3">Enviar mensaje</button>
                </form>
            </section>

            <!-- Bloque Ubicación e Información de Contacto -->
            <section class="contact-card info-card-wrapper">
                <div class="location-card p-3 mb-3 border rounded-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="info-details flex-grow-1">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-geo-alt me-2 fs-5 text-dark"></i>
                                <span class="fw-bold text-dark">Nuestra ubicación</span>
                            </div>
                            <hr class="my-2 border-secondary-subtle">
                            <div class="d-flex align-items-center mb-2 text-secondary">
                                <i class="bi bi-envelope me-2 text-dark fs-5"></i>
                                <span>Envíanos un correo</span>
                            </div>
                            <div class="d-flex align-items-center text-secondary">
                                <i class="bi bi-telephone me-2 text-dark fs-5"></i>
                                <span>Llámanos</span>
                            </div>
                        </div>

                        <!-- Vista previa estilizada del Mapa -->
                        <div class="map-box ms-3">
                            <div class="map-placeholder">
                                <i class="bi bi-geo-alt-fill map-pin"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botón de regreso al inicio -->
                <a href="../index.html" class="btn btn-back-home w-100 d-block text-center text-decoration-none">Volver
                    al inicio</a>
            </section>

        </div>

        <!-- Footer decorativo -->
        <footer class="text-center text-muted footer-text w-100 mt-auto pt-3">
            &copy; 2026 KICKZ Inc. Todos los derechos reservados.
        </footer>
    </main>

</body>

</html>
